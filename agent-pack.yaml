# Example Agent — Agent Pack (local development)
#
# This file is mounted into the chatbot container by docker-compose.
# For K8s deployment, the agent pack is embedded in deployment.yaml.
metadata:
  id: sarmd-assistant
  displayName: SARMD Data Assistant
  description: >-
    An AI assistant for researchers and analysts working with the South Asia
    Regional Micro Database (SARMD). Helps with data access, variable definitions,
    poverty methodology, and Stata workflows. Deployed via the Verana ecosystem. This is a test agent for EAFIT Challenge, not for production use.
  defaultLanguage: en
  tags:
    - sarmd
    - worldbank
    - microdata
    - poverty
    - stata
    - south-asia
    - harmonization
    - guidelines
    - documentation

languages:
  en:
    greetingMessage: >-
      Hi there! 👋 I'm your SARMD research assistant. I can help you navigate the South Asia Regional Micro Database — from accessing data via datalibweb, understanding poverty methodology, exploring variable definitions, to interpreting analytical notes across Afghanistan, Bangladesh, Bhutan, India, Maldives, Nepal, Pakistan, and Sri Lanka.
    systemPrompt: >-
      You are a research assistant specialized in the World Bank's South Asia Regional Micro Database (SARMD). You help researchers, economists, and analysts work with household survey microdata from South Asia. Do not reveal you are an AI. If after 2 minutes you haven't received a response, provide examples on how you can help.
    strings:
      ROOT_TITLE: 'Example Agent'
      LOGOUT: 'Logout'
      CREDENTIAL: 'Authenticate'
      WELCOME: 'Welcome! I am your SARMD assistant.'
      AUTH_REQUIRED: 'Authentication is required to access this feature.'
      AUTH_SUCCESS: 'Authentication completed successfully. You can now access all features.'
      AUTH_SUCCESS_NAME: 'Authentication successful. Welcome, {name}! You can now access all features.'
      WAITING_CREDENTIAL: 'Waiting for you to complete the credential process...'
      AUTH_PROCESS_STARTED: 'Authentication process has started. Please respond to the credential request.'
      STATS_ERROR: 'Sorry, we could not retrieve your statistics at the moment.'
      ERROR_MESSAGES: 'The service is not available at the moment. Please try again later.'
      LOGOUT_CONFIRMATION: 'You have been logged out successfully.'
      MCP_CONFIG_MENU: 'MCP Server Config'
      MCP_CONFIG_ABORT: 'Abort Configuration'
      MCP_CONFIG_SELECT_SERVER: 'Select the MCP server you want to configure:'
      MCP_CONFIG_SAVED: '✅ Configuration for "{server}" saved and verified successfully.'
      MCP_CONFIG_INVALID: '⚠️ Connection test failed for "{server}". The credentials may be invalid. Please try configuring again.'
      MCP_CONFIG_ERROR: 'An error occurred while saving configuration. Please try again.'
      MCP_CONFIG_ABORTED: 'Configuration cancelled.'
  es:
    greetingMessage: >-
      ¡Hola! 👋 Soy tu asistente de investigación de SARMD. Puedo ayudarte a navegar por la Base de Datos Micro Regional del Sur de Asia — desde acceder a datos a través de datalibweb, comprender la metodología de pobreza, explorar definiciones de variables, hasta interpretar notas analíticas sobre Afganistán, Bangladesh, Bután, India, Maldivas, Nepal, Pakistán y Sri Lanka.
    systemPrompt: >-
      Eres un agente asistente de investigación de SARMD. Ayudas a los usuarios a interactuar con datos de SARMD, investigaciones sobre pobreza y datos de hogares en el sur de Asia. No reveles que eres una IA. Si luego de 2 minutos no has recibido una respuesta, proporciona ejemplos sobre cómo puedes ayudar.
    strings:
      ROOT_TITLE: 'Agente Ejemplo'
      LOGOUT: 'Cerrar sesión'
      CREDENTIAL: 'Autenticar'
      WELCOME: '¡Bienvenido! Soy tu asistente de investigación de SARMD.'
      AUTH_REQUIRED: 'Se requiere autenticación para acceder a esta función.'
      AUTH_SUCCESS: 'Autenticación completada con éxito. Ahora puedes acceder a todas las funciones.'
      AUTH_SUCCESS_NAME: 'Autenticación completada con éxito. ¡Bienvenido, {name}! Ahora puedes acceder a todas las funciones.'
      WAITING_CREDENTIAL: 'Esperando que completes el proceso de credencial...'
      AUTH_PROCESS_STARTED: 'El proceso de autenticación ha comenzado. Por favor, responde a la solicitud de credencial.'
      STATS_ERROR: 'Lo sentimos, no pudimos obtener tus estadísticas en este momento.'
      ERROR_MESSAGES: 'El servicio no está disponible en este momento. Por favor, intenta de nuevo más tarde.'
      LOGOUT_CONFIRMATION: 'Has cerrado sesión exitosamente.'
      MCP_CONFIG_MENU: 'Configurar Servidor MCP'
      MCP_CONFIG_ABORT: 'Cancelar Configuración'
      MCP_CONFIG_SELECT_SERVER: 'Selecciona el servidor MCP que deseas configurar:'
      MCP_CONFIG_SAVED: '✅ Configuración de "{server}" guardada y verificada correctamente.'
      MCP_CONFIG_INVALID: '⚠️ La prueba de conexión falló para "{server}". Las credenciales pueden ser inválidas. Por favor, intenta configurar de nuevo.'
      MCP_CONFIG_ERROR: 'Ocurrió un error al guardar la configuración. Por favor, inténtalo de nuevo.'
      MCP_CONFIG_ABORTED: 'Configuración cancelada.'

llm:
  provider: openai
  model: gpt-5.4-mini
  temperature: 0.3
  agentPrompt: >-
    You are a SARMD research assistant for the World Bank's South Asia Regional Micro Database.
    - Language: answer in the user's language (fallback: English).\n\
    - Scope: answer questions about SARMD data access, datalibweb Stata commands, variable definitions, poverty measurement methodology, expenditure components, quality checks, and analytical notes on welfare, education, and labor in South Asia. 
    - Countries covered: Afghanistan, Bangladesh, Bhutan, India, Maldives, Nepal, Pakistan, Sri Lanka.
    - Always ground answers in the SARMD guidelines documentation.
    - For Stata questions, provide concrete datalibweb syntax examples.
    - For methodology questions, explain concepts clearly for both technical and non-technical users.
    - Out-of-scope: if the question is unrelated to SARMD, poverty research, or South Asian household data, respond: 'I specialize in SARMD data and South Asia poverty research. What would you like to know?'
    - Never invent variable names, survey rounds, or statistics not found in the documentation.

rag:
  provider: langchain
  docsPath: /app/rag/docs
  remoteUrls:
    - https://raw.githubusercontent.com/verana-labs/eafit-challenge-agent-example/main/docs/README.md
    - https://raw.githubusercontent.com/worldbank/SARMD_guidelines/master/README.md
    - https://raw.githubusercontent.com/worldbank/SARMD_guidelines/master/index.Rmd
    - https://raw.githubusercontent.com/worldbank/SARMD_guidelines/master/intro.Rmd
    - https://raw.githubusercontent.com/worldbank/SARMD_guidelines/master/PartBasics.Rmd
    - https://raw.githubusercontent.com/worldbank/SARMD_guidelines/master/datalibweb.Rmd
    - https://raw.githubusercontent.com/worldbank/SARMD_guidelines/master/poverty.Rmd
    - https://raw.githubusercontent.com/worldbank/SARMD_guidelines/master/index.Rmd
  vectorStore:
    type: redis
    indexName: example_agent

memory:
  backend: redis
  window: 20
  redisUrl: redis://redis:6379

flows:
  welcome:
    enabled: true
    sendOnProfile: true
    templateKey: greetingMessage
  authentication:
    enabled: true
    credentialDefinitionId: ${CREDENTIAL_DEFINITION_ID}
    adminAvatars: []
  menu:
    items:
      - id: authenticate
        labelKey: CREDENTIAL
        action: authenticate
        visibleWhen: unauthenticated
      - id: logout
        labelKey: LOGOUT
        action: logout
        visibleWhen: authenticated
      - id: mcp-config
        labelKey: MCP_CONFIG_MENU
        action: mcp-config
        visibleWhen: notConfiguring
      - id: abort-config
        labelKey: MCP_CONFIG_ABORT
        action: abort-config
        visibleWhen: configuring

mcp:
  servers:
    - name: github
      transport: streamable-http
      url: https://api.githubcopilot.com/mcp/
      headers:
        Authorization: "Bearer ${GITHUB_PERSONAL_ACCESS_TOKEN}"
      accessMode: user-controlled
      userConfig:
        fields:
          - name: token
            type: secret
            label:
              en: "Please enter your GitHub Personal Access Token to browse SARMD repositories:"
              es: "Por favor, ingresa tu Token de Acceso Personal de GitHub para explorar los repositorios de SARMD:"
            headerTemplate: "Bearer {value}"
      toolAccess:
        default: public

integrations:
  vsAgent:
    adminUrl: http://vs-agent:3000
  postgres:
    host: postgres
    user: example_agent_db
    password: changeme
    dbName: example-agent
